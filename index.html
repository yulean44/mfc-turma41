<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planeta de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ink:#e9f0f8; --muted:#97a6bd; --faint:#5d6b84; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --glass:rgba(22,32,52,.55); --glass2:rgba(255,255,255,.06); --glass3:rgba(255,255,255,.10); --solid:rgba(16,24,40,.86);
  --acc:#9fe0b0; --acc2:#8fd6ff; --acc-soft:rgba(159,224,176,.14); --ok:#9fe0b0; --bad:#f2a08f; --gold:#f2c46e;
  --font:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --on-ink:#0f1626; --doc:#d6dfeb; --forte:#ffffff; --opt:#141d31;
  --fundo:radial-gradient(60% 50% at 30% 45%,#1e2d48 0%,rgba(30,45,72,0) 70%),radial-gradient(50% 40% at 80% 80%,rgba(70,110,140,.25),transparent 70%),linear-gradient(180deg,#141d31 0%,#0c1220 100%);
  color-scheme:dark;
}
:root[data-tema="meianoite"]{
  --glass:rgba(10,12,20,.6); --solid:rgba(6,8,14,.92); --muted:#8a93a6; --faint:#4a5163; --line:rgba(255,255,255,.08);
  --acc:#9fe0b0; --acc2:#8fb8ff;
  --fundo:radial-gradient(45% 40% at 30% 45%,#121a2c 0%,rgba(18,26,44,0) 70%),linear-gradient(180deg,#05070d 0%,#000000 100%);
}
:root[data-tema="cristal"]{
  --acc:#9ff0e2; --acc2:#b8ecff; --acc-soft:rgba(159,240,226,.14); --glass:rgba(20,44,58,.5); --solid:rgba(14,32,44,.88);
  --fundo:radial-gradient(55% 45% at 30% 45%,#1d4357 0%,rgba(29,67,87,0) 70%),radial-gradient(45% 35% at 85% 15%,rgba(120,220,230,.18),transparent 70%),linear-gradient(180deg,#10283a 0%,#08141f 100%);
}
:root[data-tema="aurora"]{
  --acc:#a8f0c8; --acc2:#c9b3f0; --acc-soft:rgba(201,179,240,.14); --glass:rgba(34,28,58,.5); --solid:rgba(24,20,44,.88);
  --fundo:radial-gradient(50% 40% at 20% 15%,rgba(140,230,180,.25),transparent 70%),radial-gradient(50% 45% at 85% 25%,rgba(160,130,240,.28),transparent 70%),radial-gradient(60% 50% at 30% 50%,#2a2350 0%,rgba(42,35,80,0) 70%),linear-gradient(180deg,#191433 0%,#0b0a1a 100%);
}
:root[data-tema="floresta"]{
  --acc:#b5e48c; --acc2:#9fe0b0; --acc-soft:rgba(181,228,140,.14); --glass:rgba(22,44,30,.52); --solid:rgba(14,30,20,.9); --muted:#9cb39f; --faint:#5f7663;
  --fundo:radial-gradient(55% 45% at 30% 45%,#1f4a33 0%,rgba(31,74,51,0) 70%),radial-gradient(45% 35% at 80% 85%,rgba(140,200,110,.16),transparent 70%),linear-gradient(180deg,#11261a 0%,#07120c 100%);
}
:root[data-tema="amanhecer"]{
  --ink:#1d2a3a; --muted:#5e6e83; --faint:#9aa8ba; --line:rgba(30,50,80,.12); --line2:rgba(30,50,80,.2);
  --glass:rgba(255,255,255,.58); --glass2:rgba(30,50,80,.05); --glass3:rgba(30,50,80,.09); --solid:rgba(255,255,255,.9);
  --acc:#3f9a6a; --acc2:#3a8fc0; --acc-soft:rgba(63,154,106,.12); --ok:#3f9a6a; --bad:#c0574b; --gold:#b8860b;
  --on-ink:#ffffff; --doc:#2b3a4c; --forte:#0f1b2a; --opt:#ffffff;
  --fundo:radial-gradient(55% 50% at 30% 45%,#ffffff 0%,rgba(255,255,255,0) 70%),radial-gradient(50% 40% at 85% 15%,rgba(170,225,200,.5),transparent 70%),radial-gradient(50% 40% at 80% 90%,rgba(180,210,240,.6),transparent 70%),linear-gradient(180deg,#e9f2f9 0%,#d3e3ef 100%);
  color-scheme:light;
}
:root[data-tema="amanhecer"] .vidro{box-shadow:0 20px 50px rgba(40,70,110,.12),inset 0 1px 0 rgba(255,255,255,.8)}
:root[data-tema="amanhecer"] .modal-bg{background:rgba(200,215,230,.5)}
:root[data-tema="amanhecer"] .nav{background:rgba(255,255,255,.55)}
.fig{object-fit:contain;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.ico .fig{width:40px;height:40px}
.ico.fig-on{background:radial-gradient(circle,rgba(143,214,255,.14),transparent 70%);border-color:transparent}
.chipi .fig{width:22px;height:22px;margin:-4px 0}
.efe .fig{width:24px;height:24px;margin:-4px 0}
.festa .im img.fig{width:130px;height:130px}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tema{border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:transparent}
.tema.on{border-color:var(--acc2);color:var(--ink)}
.tema i{display:block;height:58px;border-radius:10px;margin-bottom:8px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;background:var(--fundo);background-attachment:fixed;transition:background .6s}
html:not([data-tema]) body.aurora{background:radial-gradient(50% 40% at 25% 20%,rgba(140,220,170,.22),transparent 70%),radial-gradient(50% 40% at 80% 25%,rgba(150,130,230,.22),transparent 70%),radial-gradient(60% 50% at 30% 45%,#1e2d48 0%,rgba(30,45,72,0) 70%),linear-gradient(180deg,#141d31 0%,#0c1220 100%);background-attachment:fixed}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px;stroke-width:1.5}
::selection{background:rgba(143,214,255,.3)}

/* ---------- espaço e planeta ---------- */
#espaco{position:fixed;inset:0;z-index:0}
.mundo-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

/* ---------- navegação ---------- */
.nav{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-radius:28px;background:rgba(18,27,45,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.navbtn{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s}
.navbtn:hover{color:var(--ink);background:var(--glass2)}
.navbtn.active{color:var(--on-ink);background:var(--ink)}
.navbtn .tip{position:absolute;left:58px;white-space:nowrap;font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:0;pointer-events:none;transform:translateX(-4px);transition:.2s}
.navbtn:hover .tip{opacity:1;transform:none}
.marca{position:fixed;left:30px;top:26px;z-index:20;font-size:12px;font-weight:300;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}

/* ---------- conteúdo ---------- */
.main{position:relative;z-index:10;min-height:100vh;padding:26px 34px 60px 110px;pointer-events:none}
.main > *{pointer-events:auto}
#view-inicio,#view-mundo,#view-inicio .home,#view-inicio .esq,#view-mundo .mundo-ui{pointer-events:none}
#view-inicio .vidro,#view-mundo .vidro,#view-inicio .esq > *,#view-mundo .mundo-ui > div:first-child{pointer-events:auto}
.view{max-width:1240px;margin:0 auto}
.topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin:0 0 18px;pointer-events:auto}
.chipi{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:13px;color:var(--ink);font-weight:400;letter-spacing:.04em}
.chipi .lbar{width:90px;height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.chipi .lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.on{background:var(--acc)}

.titulo{font-weight:200;font-size:clamp(30px,4.2vw,54px);letter-spacing:.32em;text-transform:uppercase;line-height:1.15;margin:0}
.titulo.p{font-size:clamp(24px,2.8vw,36px);letter-spacing:.24em}
.sub{font-weight:300;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin:10px 0 0}
.kicker{font-size:11px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.intro{color:var(--muted);font-weight:300;margin:12px 0 26px;max-width:640px}
.linha{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:18px 0}

.vidro{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06)}
.card{padding:20px 22px}
.h-sec{font-size:11.5px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.h-sec .grow{flex:1}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--glass2);color:var(--ink);font-weight:400;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:10px 18px;border-radius:99px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn:hover{background:var(--glass3);border-color:rgba(255,255,255,.3)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{background:#fff}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.bad{border-color:rgba(242,160,143,.5);color:var(--bad)}
.btn.ic{padding:7px;border-radius:50%}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px;transition:width .5s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.empty{padding:24px;text-align:center;color:var(--muted);font-weight:300}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:14px;padding:10px 14px;font:400 14.5px var(--font);outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--acc2)}
select.f option{background:var(--opt)}
label.lb{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--acc2)}
.ico img{width:30px;height:30px;object-fit:contain}
.ico.ok{color:var(--acc);border-color:rgba(159,224,176,.4)}

/* ---------- início ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:30px;min-height:calc(100vh - 120px)}
.home .esq{display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.home .esq > *{pointer-events:auto}
.home .dir{display:flex;flex-direction:column;gap:14px}
.stats{display:flex;gap:34px;flex-wrap:wrap}
.stat b{display:block;font-weight:200;font-size:38px;line-height:1;letter-spacing:.02em}
.stat span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.miss{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.miss:last-child{border-bottom:0}
.miss .t{flex:1;min-width:0}
.miss .t b{display:block;font-weight:400;font-size:14.5px;line-height:1.3}
.miss .t small{display:block;color:var(--muted);font-size:12px;margin:2px 0 6px}
.miss.done{opacity:.55}
.miss .rw{font-size:11.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.premios{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.premios span{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.acao{display:flex;align-items:center;gap:14px}
.acao .t{flex:1;min-width:0}.acao .t b{display:block;font-weight:400}.acao .t span{font-size:12.5px;color:var(--muted)}
.dica-mundo{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

/* ---------- páginas (painel de vidro) ---------- */
.pagina{max-width:980px;margin-left:auto}
.pagina.larga{max-width:1240px}

/* ---------- mundo ---------- */
.mundo-ui{display:flex;flex-direction:column;justify-content:space-between;min-height:calc(100vh - 120px);pointer-events:none}
.mundo-ui > *{pointer-events:auto}
.colecao{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.cria{flex:none;width:74px;text-align:center;cursor:pointer;border-radius:18px;padding:10px 6px;border:1px solid transparent;transition:.2s}
.cria:hover{border-color:var(--line);background:var(--glass2)}
.cria .im{width:52px;height:52px;margin:0 auto;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(143,214,255,.16),transparent 70%)}
.cria .im img{width:56px;height:56px;object-fit:contain}
.cria .nm{font-size:10.5px;margin-top:4px;line-height:1.25}
.cria .rr{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cria.lock{opacity:.4;cursor:default}
.cria.lock .im{color:var(--faint)}
.efeitos{display:flex;gap:8px;flex-wrap:wrap}
.efe{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.efe.on{color:var(--ink);border-color:rgba(143,214,255,.4);background:rgba(143,214,255,.08)}
.efe svg{color:var(--acc2)}

.painel-mundo{max-width:720px;padding:12px 16px}
.painel-mundo .efeitos{gap:6px}.painel-mundo .efe{padding:4px 10px 4px 6px;font-size:11.5px}
.painel-mundo .h-sec{margin:0}
.painel-mundo .colecao{margin-top:10px}
/* textos sobre o planeta somem enquanto você gira ou dá zoom, e voltam sozinhos */
.some-ao-girar{transition:opacity .45s ease, transform .45s ease}
body.explorando .some-ao-girar{opacity:0;transform:translateY(-6px);pointer-events:none}
body.explorando #view-mundo .painel-mundo{opacity:.15}
#view-mundo .painel-mundo{transition:opacity .45s}
/* ---------- foco ---------- */
.foco-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:4vh}
.tempo-big{font-weight:200;font-size:clamp(70px,13vw,150px);letter-spacing:.06em;line-height:1;font-variant-numeric:tabular-nums}
.durs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.durs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:7px 15px;font:400 12px var(--font);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.durs button.on{color:var(--on-ink);background:var(--ink);border-color:var(--ink)}
.timerpill{position:fixed;right:22px;bottom:22px;z-index:35;display:flex;align-items:center;gap:10px;cursor:pointer}
.timerpill b{font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.08em}

/* ---------- matérias ---------- */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mat{padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:.2s}
.mat:hover{border-color:var(--line2);transform:translateY(-2px)}
.mat .hd{display:flex;align-items:center;gap:14px}
.mat b{font-weight:400;font-size:16px;line-height:1.3}
.mat small{color:var(--muted);font-size:12.5px}
.mat.add{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;min-height:150px;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.secs{display:flex;flex-direction:column}
.sec{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.sec:last-child{border-bottom:0}
.sec:hover{padding-left:10px}
.sec .ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--on-ink)}
.sec.lida .ck{background:var(--acc);border-color:var(--acc)}
.sec .t{flex:1;min-width:0;font-weight:400;font-size:15px;line-height:1.35}
.sec .n{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.grupo{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:26px 0 4px}
.ownbar{display:flex;gap:4px;opacity:.6}
.sec:hover .ownbar{opacity:1}
.backlink{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:0;margin:0 0 18px}
.backlink:hover{color:var(--ink)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.tabs button{border:0;background:transparent;border-radius:99px;padding:7px 16px;font:400 11.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--on-ink)}

/* ---------- leitura ---------- */
.leitura{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:26px;align-items:start}
.doc{padding:34px 40px;background:var(--solid)}
.toc{position:sticky;top:30px;max-height:calc(100vh - 60px);overflow:auto;padding:16px 12px}
.toc ul{list-style:none;margin:0;padding:0}
.toc a{display:block;padding:6px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.35}
.toc a:hover{color:var(--ink);background:var(--glass2)}
.doc h2{font-weight:300;font-size:23px;letter-spacing:.06em;line-height:1.3;margin:38px 0 12px}
.doc h3{font-weight:400;font-size:16.5px;margin:30px 0 10px;line-height:1.4;padding:10px 0 8px;border-bottom:1px solid var(--line2);color:var(--forte)}
.doc p{margin:0 0 13px;color:var(--doc);font-weight:300}
.doc strong,.doc b{font-weight:500;color:var(--forte)}
.doc ul,.doc ol{margin:0 0 16px;padding-left:22px;color:var(--doc);font-weight:300}
.doc li{margin:4px 0}
.doc a{color:var(--acc2)}
.doc blockquote{margin:18px 0;padding:12px 18px;border-left:2px solid var(--acc2);background:rgba(143,214,255,.06);border-radius:0 12px 12px 0}
.doc blockquote p:last-child{margin:0}
.tablewrap{overflow-x:auto;margin:6px 0 20px;border:1px solid var(--line);border-radius:14px}
.doc table{border-collapse:collapse;width:100%;font-size:14px}
.doc th{text-align:left;font-weight:400;font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);background:rgba(255,255,255,.03)}
.doc th,.doc td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-weight:300}
.doc tr:last-child td{border-bottom:0}
.lvtag{display:inline-block;font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;padding:2px 10px;border-radius:99px;border:1px solid var(--line2)}
.lvtag.l1{border-color:var(--acc);color:var(--acc)}.lvtag.l2{border-color:var(--acc2);color:var(--acc2)}.lvtag.l3{color:var(--muted)}.lvtag.l4{color:var(--faint)}
.lbl{display:block;padding:12px 16px;border-radius:14px;margin:0 0 12px}
.lbl > strong:first-child{display:block;font-size:10.5px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;margin-bottom:4px;color:var(--acc2)}
.lbl-why{padding:0 2px}
.lbl-learn{background:rgba(255,255,255,.04);border:1px solid var(--line)}
.lbl-mem{padding:0;margin:20px 0 6px}
.lbl-mem > strong:first-child{display:inline-block;color:var(--acc);border:1px solid rgba(159,224,176,.5);padding:2px 10px;border-radius:99px}
.lbl-div{border:1px dashed var(--line2)}
.lbl-ref{font-size:13.5px;padding:0 2px}.lbl-ref > strong:first-child{display:inline;margin-right:6px}
.xref{cursor:pointer;color:var(--acc2);text-decoration:underline;text-underline-offset:3px}
li.task{list-style:none;margin-left:-22px;display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
li.task input{margin-top:4px;width:18px;height:18px;accent-color:#9fe0b0;flex:none;cursor:pointer}
li.task.done > span{color:var(--faint);text-decoration:line-through}
.leiturafim{display:flex;align-items:center;gap:16px;margin-top:34px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;flex-wrap:wrap}
.leiturafim .t{flex:1;min-width:200px}
.searchhit{background:rgba(242,196,110,.35);color:#fff;border-radius:3px}
.edbar{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:3;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px;background:var(--solid)}
.edbar button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:5px 12px;font:400 12px var(--font);cursor:pointer}
.edbar button:hover{background:var(--glass2)}
.editavel{outline:none;min-height:320px}

/* consulta lateral: outra seção sempre ao lado da leitura */
.consulta{position:fixed;top:14px;right:14px;bottom:14px;width:min(560px,44vw);z-index:30;display:flex;flex-direction:column;background:var(--solid);transform:translateX(110%);transition:transform .3s ease}
.consulta.aberta{transform:none}
.consulta .cab{display:flex;flex-direction:column;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.consulta .cab .lin{display:flex;align-items:center;gap:8px}
.consulta .cab .tabs{flex-wrap:wrap}
.consulta .corpo{overflow:auto;padding:6px 22px 30px}
.consulta .corpo.doc{padding:6px 22px 30px;background:transparent}
body.com-consulta .main{padding-right:calc(min(560px,44vw) + 30px)}
body.com-consulta .leitura{grid-template-columns:1fr}
body.com-consulta .leitura .toc{display:none}
@media (max-width:900px){.consulta{width:auto;left:10px;top:10px;bottom:84px}body.com-consulta .main{padding-right:14px}}
/* ---------- flashcards ---------- */
.fc-wrap{max-width:780px;margin:0 auto}
.fc-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.fc-top select{flex:1;min-width:170px}
.fc-card{perspective:1600px;cursor:pointer;user-select:none;margin:0 0 18px}
.fc-inner{position:relative;min-height:320px;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc-card.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:50px 40px;display:flex;flex-direction:column;justify-content:center}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(143,214,255,.16),rgba(159,224,176,.10)),var(--glass)}
.fc-tag{position:absolute;top:18px;left:24px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.fc-box{position:absolute;top:16px;right:22px;display:flex;gap:4px}
.fc-box i{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}.fc-box i.on{background:var(--acc);border-color:var(--acc)}
.fc-q{font-size:23px;font-weight:300;line-height:1.4;text-align:center}
.fc-q b,.fc-a b{font-weight:500}
.fc-a{font-size:18px;font-weight:300;line-height:1.6;text-align:center}
.fc-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.fc-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fc-nav .grow{flex:1}
.fc-nav .btn{padding:12px 26px}
.roundbar{display:flex;align-items:center;gap:14px;margin:0 0 16px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.roundbar .bar{flex:1}
.cardrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.cardrow .ce{border-radius:12px;padding:8px 12px;min-height:38px;outline:none;font-size:14px;font-weight:300;border:1px solid transparent}
.cardrow .ce[contenteditable]:hover{border-color:var(--line)}
.cardrow .ce:focus{border-color:var(--acc2)}

/* ---------- missões ---------- */
.dois{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.jstep{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.jstep:last-child{border-bottom:0}
.jstep .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.jstep.ok .n{background:var(--acc);border-color:var(--acc);color:var(--on-ink)}
.jstep.atual .n{border-color:var(--acc2);color:var(--acc2);box-shadow:0 0 0 4px rgba(143,214,255,.12)}
.jstep.lock{opacity:.4}
.jstep .t{flex:1;min-width:0}
.jstep .t b{display:block;font-weight:400;font-size:15px}
.jstep .t small{color:var(--muted);font-size:12.5px}

/* ---------- progresso ---------- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
table.tb th{text-align:left;font-size:10.5px;font-weight:400;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:11px 10px;border-bottom:1px solid var(--line);font-weight:300}

/* ---------- modal, festa, toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,10,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(460px,100%);max-height:90vh;overflow:auto;padding:28px;background:rgba(20,30,50,.85)}
.modal h3{margin:0 0 8px;font-weight:300;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.festa{text-align:center;padding:8px 0}
.festa .im{width:150px;height:150px;margin:0 auto 8px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(143,214,255,.28),transparent 68%);animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.festa .im img{width:140px;height:140px;object-fit:contain}
.festa .im svg{width:62px;height:62px;stroke-width:1;color:var(--acc2)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.toasts{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:99px;font-size:13px;letter-spacing:.04em;background:rgba(20,30,50,.85);backdrop-filter:blur(14px);border:1px solid var(--line2);animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* ---------- responsivo ---------- */
@media (max-width:1100px){
  .home{grid-template-columns:1fr}
  .home .esq{min-height:58vh}
  .leitura,.dois{grid-template-columns:1fr}
  .toc{display:none}
}
@media (max-width:760px){
  body{font-size:15px}
  .nav{left:10px;right:10px;bottom:10px;top:auto;transform:none;flex-direction:row;justify-content:space-around;border-radius:22px;padding:6px}
  .navbtn{width:42px;height:42px}
  .navbtn .tip{display:none}
  .marca{left:18px;top:18px;letter-spacing:.3em;font-size:10.5px}
  .main{padding:56px 14px 96px}
  .topo{justify-content:flex-start;gap:6px}
  .chipi{padding:6px 11px;font-size:12px}.chipi .lbar{width:50px}
  .home .esq{min-height:52vh}
  .stats{gap:22px}.stat b{font-size:28px}
  .doc{padding:22px 18px}
  .grid2,.grid3{grid-template-columns:1fr}
  .fc-inner{min-height:270px}.fc-face{padding:44px 20px}.fc-q{font-size:19px}.fc-a{font-size:16px}
  .timerpill{bottom:82px;right:12px}
  .cardrow{grid-template-columns:1fr}
  .titulo{letter-spacing:.2em}
}
</style>
</head>
<body>
<div id="espaco"></div>
<div class="marca">Planeta de Estudos</div>
<nav class="nav" aria-label="Navegação" id="nav"></nav>
<main class="main">
  <div class="topo" id="topo"></div>
  <section class="view" id="view-inicio"></section>
  <section class="view" id="view-mundo" hidden></section>
  <section class="view" id="view-foco" hidden></section>
  <section class="view" id="view-materias" hidden></section>
  <section class="view" id="view-revisao" hidden></section>
  <section class="view" id="view-missoes" hidden></section>
  <section class="view" id="view-progresso" hidden></section>
</main>
<div class="toasts" id="toasts"></div>
<div id="timerPill" class="timerpill chipi" hidden></div>
<aside class="consulta vidro" id="consulta" aria-label="Consulta lateral"></aside>
<div id="modalRoot"></div>
<script type="module" src="app.js?v=14"></script>
</body>
</html>
